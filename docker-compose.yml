version: "3"

services:
  web:
    image: shdv/hat.sh
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - 3991:80
    volumes:
      - ./src:/usr/share/nginx/html/out

  signal:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      - TURN_URL=${TURN_URL:-}
      - TURN_SECRET=${TURN_SECRET:-}
    restart: unless-stopped
